[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "editor-vr"
version = "0.1.0"
description = "A shared desktop and Quest workspace for annotating 3D print models"
requires-python = ">=3.11"
dependencies = ["Flask>=3.1,<4", "flask-sock>=0.7,<1", "numpy>=2,<3", "cryptography>=42", "faster-whisper>=1.1,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
editor-vr = "editor_vr.__main__:main"

[tool.setuptools.packages.find]
include = ["editor_vr*"]

[tool.setuptools.package-data]
editor_vr = ["templates/*", "static/*", "static/backgrounds/*", "static/vendor/*", "static/vendor/hands/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
