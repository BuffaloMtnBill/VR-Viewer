[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vr-viewer"
dynamic = ["version"]
description = "View 3D print models (STL, OBJ, 3MF) on the desktop and in a Meta Quest, together, over your local network"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY.md", "THIRD-PARTY-TERRAIN-LICENSE.txt"]
authors = [{ name = "BuffaloMtnBill" }]
requires-python = ">=3.11"
keywords = ["3d", "stl", "3mf", "webxr", "vr", "quest", "viewer", "3d-printing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Rendering",
]
dependencies = ["Flask>=3.1,<4", "flask-sock>=0.7,<1", "numpy>=2,<3", "cryptography>=42"]

[project.optional-dependencies]
# Voice commands in VR: speech is transcribed on this computer with Whisper.
voice = ["faster-whisper>=1.1,<2"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/BuffaloMtnBill/VR-Viewer"
Issues = "https://github.com/BuffaloMtnBill/VR-Viewer/issues"

[project.scripts]
vr-viewer = "vr_viewer.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "vr_viewer.__version__" }

[tool.setuptools.packages.find]
include = ["vr_viewer*"]

[tool.setuptools.package-data]
vr_viewer = ["templates/*", "static/*", "static/backgrounds/*", "static/vendor/*", "static/vendor/hands/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
