name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install the app and test dependencies
        run: python -m pip install -e ".[test]"
      - name: Run the tests
        run: python -m pytest -q

  package:
    name: Build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build the wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean environment and run it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/vr-viewer --help
          /tmp/clean/bin/python -c "import vr_viewer, pathlib; root = pathlib.Path(vr_viewer.__file__).parent; assert (root / 'templates/index.html').is_file() and (root / 'static/vendor/three.module.js').is_file() and (root / 'static/vendor/hands/left.glb').is_file()"

  browser:
    name: Browser and VR tests (Chromium, IWER)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install the app
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e .
      - name: Install Playwright, IWER, and Chromium
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Run the browser tests
        run: npm test
